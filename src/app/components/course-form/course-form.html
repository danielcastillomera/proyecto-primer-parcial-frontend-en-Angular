<div class="card p-4 shadow-sm onix-card">
  <h2 class="h4 mb-3">Registrar curso</h2>
  <div class="mb-3">
    <label class="form-label">Nombre del curso</label>
    <input type="text" class="form-control" [(ngModel)]="nombre"
      placeholder="Ingrese el nombre del curso" />
  </div>
  <div class="mb-3">
    <label class="form-label">Docente</label>
    <input type="text" class="form-control" [(ngModel)]="docente"
      placeholder="Ingrese el nombre del docente" />
  </div>
  <div class="form-check mb-3">
    <input id="cursoActivo" type="checkbox" class="form-check-input" [(ngModel)]="activo" />
    <label class="form-check-label" for="cursoActivo">Curso activo</label>
  </div>
  <button class="btn btn-success w-100" (click)="agregarCurso()">Aceptar</button>
</div>
